<html lang="gu">
<head>

<title>ઉત્તર બુનિયાદી આશ્રમ શાળા — Digital Campus</title>
<meta name="description" content="Uttar Buniyadi Ashram Shala — Digital Campus System">
<link rel="icon" href="./logo.png">
<style>
:root{--green:#173d2b;--green2:#285a3d;--mint:#eaf4ec;--cream:#fbfaf4;--gold:#d8ad4b;--gold2:#f7e8b8;--ink:#1d2a22;--muted:#6b786f;--line:#dfe8df;--white:#fff;--rose:#fff0f0;--shadow:0 18px 50px rgba(23,61,43,.10);--r:24px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 5% 0%,#edf7ed 0,transparent 28%),radial-gradient(circle at 100% 0%,#fff4d4 0,transparent 25%),var(--cream)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.hidden{display:none!important}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:rgba(251,250,244,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(223,232,223,.9)}.topin{max-width:1400px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand img{width:48px;height:48px;object-fit:contain}.brand b{display:block;font-size:15px;line-height:1.15;color:var(--green)}.brand small{display:block;color:var(--muted);font-weight:700;margin-top:3px}.spacer{flex:1}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:800;font-size:12px}.btn{border:0;border-radius:15px;padding:11px 15px;font-weight:850;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{transform:translateY(-1px)}.primary{background:var(--green);color:#fff;box-shadow:0 8px 22px rgba(23,61,43,.16)}.soft{background:var(--mint);color:var(--green)}.gold{background:var(--gold2);color:var(--green)}.ghost{background:#fff;color:var(--green);border:1px solid var(--line)}.danger{background:#b74747;color:#fff}.layout{max-width:1400px;margin:auto;display:flex}.side{width:275px;min-height:calc(100vh - 73px);position:sticky;top:73px;padding:22px 17px;border-right:1px solid var(--line);background:rgba(255,255,255,.32)}.sidebrand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}.sidebrand img{width:58px;height:58px}.sidebrand b{font-size:14px;line-height:1.15}.identity{background:linear-gradient(135deg,#edf6ed,#f8f1d9);border:1px solid var(--line);border-radius:19px;padding:13px;margin-bottom:13px}.identity strong{display:block}.identity small{color:var(--muted);font-weight:750}.nav{display:grid;gap:5px}.nav button{width:100%;text-align:left;border:0;background:transparent;border-radius:15px;padding:11px 12px;color:var(--green);font-weight:800}.nav button:hover,.nav button.active{background:var(--green);color:#fff}.main{min-width:0;flex:1;padding:30px}.mobilebar{display:none}.page{max-width:1100px;margin:auto}.hero{border-radius:32px;padding:30px;position:relative;overflow:hidden;background:linear-gradient(135deg,#173d2b,#2b6543);color:#fff;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-80px;top:-120px;background:rgba(247,232,184,.18)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#d9edcf}.hero h1{font-size:clamp(25px,4vw,38px);margin:7px 0}.hero p{max-width:720px;color:rgba(255,255,255,.82);line-height:1.7;margin:0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:800}.chip.gold{background:#f5df9e;color:var(--green);border:0}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin-top:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 8px 25px rgba(23,61,43,.05)}.stat small{display:block;color:var(--muted);font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.08em}.stat strong{display:block;font-size:28px;color:var(--green);margin-top:5px}.section{margin-top:24px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.sectionhead h2{font-size:18px;margin:0;color:var(--green)}.sectionhead p{margin:3px 0 0;color:var(--muted);font-size:12px;font-weight:650}.cards{grid-template-columns:repeat(3,1fr)}.feature{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 25px rgba(23,61,43,.05);transition:.18s}.feature:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.feature .ico{font-size:25px}.feature h3{margin:10px 0 4px;color:var(--green);font-size:15px}.feature p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.feature button{margin-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 25px rgba(23,61,43,.05);padding:20px}.two{grid-template-columns:1fr 1fr}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:17px;background:#fff}.row b{font-size:13px}.row small{display:block;color:var(--muted);margin-top:3px}.badge{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;background:var(--mint);color:var(--green)}.badge.rose{background:#ffe6e6;color:#a73f3f}.badge.gold{background:var(--gold2);color:var(--green)}.form{display:grid;gap:13px}.label{font-size:12px;font-weight:850;color:var(--green);margin-bottom:6px;display:block}.input,.select,.textarea{width:100%;border:1px solid #ccd9ce;border-radius:15px;background:#fff;padding:12px 13px;outline:none;color:var(--ink)}.input:focus,.select:focus,.textarea:focus{border-color:#7da18a;box-shadow:0 0 0 4px rgba(40,90,61,.08)}.textarea{min-height:125px;resize:vertical}.tabs{display:flex;gap:7px;overflow:auto;background:var(--mint);padding:5px;border-radius:15px;margin-bottom:15px}.tabs button{border:0;background:transparent;padding:9px 13px;border-radius:11px;color:var(--green);font-weight:800;white-space:nowrap}.tabs button.active{background:#fff;box-shadow:0 2px 9px rgba(23,61,43,.08)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f3f7f2;color:var(--green);font-size:11px}.notice{padding:13px 15px;border-radius:17px;background:#fff8df;border:1px solid #eadcae;color:#5d4d22;font-size:12px;font-weight:700;line-height:1.55}.login{min-height:100vh;display:grid;place-items:center;padding:25px}.loginwrap{width:min(1080px,100%);display:grid;grid-template-columns:1.05fr .95fr;gap:25px;align-items:center}.loginintro{padding:20px}.loginlogo{width:115px;height:115px;object-fit:contain}.loginintro h1{font-size:clamp(28px,5vw,48px);line-height:1.05;color:var(--green);margin:16px 0 10px}.loginintro p{color:var(--muted);line-height:1.75;max-width:600px}.loginbox{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:30px;padding:24px;box-shadow:var(--shadow);backdrop-filter:blur(15px)}.loginbox h2{margin:4px 0;color:var(--green)}.loginbox .sub{color:var(--muted);font-size:12px;margin:5px 0 18px}.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--mint);padding:5px;border-radius:16px;margin-bottom:17px}.switch button{border:0;background:transparent;padding:10px;border-radius:12px;font-weight:850;color:var(--green)}.switch button.active{background:#fff;box-shadow:0 2px 8px rgba(23,61,43,.08)}.demohelp{margin-top:13px;font-size:11px;color:var(--muted);line-height:1.6;background:#f7f8f4;padding:11px 12px;border-radius:14px}.modal{position:fixed;inset:0;background:rgba(13,31,21,.48);display:grid;place-items:center;padding:20px;z-index:80}.modalbox{width:min(520px,100%);background:#fff;border-radius:25px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.2)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{border:0;background:#eef4ee;color:var(--green);width:35px;height:35px;border-radius:11px;font-weight:900}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 17px;border-radius:14px;font-size:12px;font-weight:800;box-shadow:var(--shadow);z-index:100;display:none}.empty{text-align:center;padding:32px 15px;color:var(--muted)}.empty .big{font-size:32px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}.menuBtn{display:none;border:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px}.search{position:relative}.search input{padding-left:38px}.search span{position:absolute;left:13px;top:10px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{padding:15px;border-radius:18px;background:linear-gradient(135deg,#edf6ed,#fff);border:1px solid var(--line)}.kpi b{font-size:22px;color:var(--green)}.kpi small{display:block;color:var(--muted);font-weight:750;margin-top:3px}@media(max-width:1050px){.side{width:230px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.side{display:none}.mobilebar{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--line);background:rgba(251,250,244,.92);position:sticky;top:0;z-index:25}.mobilebar img{width:38px;height:38px}.mobilebar b{font-size:13px;color:var(--green)}.menuBtn{display:block}.main{padding:18px 14px}.stats{grid-template-columns:repeat(2,1fr)}.cards,.two{grid-template-columns:1fr}.loginwrap{grid-template-columns:1fr}.loginintro{text-align:center}.loginintro p{margin-left:auto;margin-right:auto}.loginlogo{width:90px;height:90px}.loginbox{max-width:500px;margin:auto;width:100%}}@media(max-width:500px){.hero{padding:23px;border-radius:25px}.hero h1{font-size:26px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.cards{grid-template-columns:1fr}.panel{padding:16px;border-radius:20px}.top{display:none}.statgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast"></div>
<script>
const S={name:'ઉત્તર બુનિયાદી આશ્રમ શાળા',en:'Uttar Buniyadi Ashram Shala',year:'2026–27',medium:'ગુજરાતી માધ્યમ'};
const subjects=[['MATH','ગણિત','Mathematics','🧮'],['SCI','વિજ્ઞાન','Science','🧪'],['SOC','સામાજિક વિજ્ઞાન','Social Science','🌍'],['ENG','અંગ્રેજી','English','🔤'],['HIN','હિન્દી','Hindi','📖'],['GUJ','ગુજરાતી','Gujarati','✍️']];
const exams={9:[['FIRST','પ્રથમ પરીક્ષા',50,17],['SECOND','દ્વિતીય પરીક્ષા',50,17],['INTERNAL','આંતરિક ગુણ',20,null],['ANNUAL','વાર્ષિક પરીક્ષા',80,33]],10:[['FIRST','પ્રથમ પરીક્ષા',80,26],['SECOND','દ્વિતીય પરીક્ષા',80,26],['INTERNAL','આંતરિક ગુણ',20,null]]};
const syllabus={9:['સંખ્યાપદ્ધતિ','બહુપદીઓ','યામભૂમિતિ','દ્વિચલ સુરેખ સમીકરણો','આપણી આસપાસના દ્રવ્ય','પરમાણુઓ અને અણુઓ'],10:['વાસ્તવિક સંખ્યાઓ','બહુપદીઓ','દ્વિચલ સુરેખ સમીકરણ યુગ્મ','દ્વિઘાત સમીકરણ','ત્રિકોણ','ત્રિકોણમિતિનો પરિચય']};
let state={user:load('dcs_user'),role:load('dcs_role'),page:'home',loginTab:'student'};
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}} function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2800)}
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function go(p){state.page=p;location.hash=p;render()}
function logout(){localStorage.removeItem('dcs_user');localStorage.removeItem('dcs_role');state.user=null;state.role=null;state.page='home';render();toast('લોગઆઉટ થઈ ગયું.')} 
function login(e){e.preventDefault();const f=new FormData(e.target);if(state.loginTab==='student'){const std=Number(f.get('std')),roll=Number(f.get('roll'));if(roll<1||roll>80)return toast('રોલ નંબર 1 થી 80 વચ્ચે રાખો.');if(f.get('pass')!==`student${std}`)return toast(`પાસવર્ડ student${std} રાખો.`);state.role='student';state.user={name:`ડેમો વિદ્યાર્થી ${roll}`,std,roll,hostel:true};}else{if(String(f.get('phone')).replace(/\D/g,'').length!==10)return toast('10 અંકનો મોબાઇલ નંબર લખો.');if(f.get('pass')!=='teacher')return toast('ડેમો પાસવર્ડ teacher છે.');state.role='teacher';state.user={name:'ડેમો શિક્ષક',role:'શિક્ષક',subject:'MATH',phone:'9999999999'};}save('dcs_user',state.user);save('dcs_role',state.role);state.page='home';render();toast('ડિજિટલ કેમ્પસમાં સ્વાગત છે 👋')}
function loginView(){return `<div class="login"><div class="loginwrap"><section class="loginintro"><img class="loginlogo" src="./logo.png"><div class="eyebrow" style="color:var(--green2)">DIGITAL CAMPUS SYSTEM</div><h1>${S.name}<br><span style="font-size:.55em;color:var(--green2)">${S.en}</span></h1><p>વિદ્યાર્થી અને શિક્ષક માટેનું એક જ ડિજિટલ પોર્ટલ — શંકા, અભ્યાસક્રમ, પરિણામ, ફરિયાદ, રેગિંગ રિપોર્ટ અને હેલ્પલાઇન એક જ જગ્યાએ.</p><div class="chips" style="justify-content:center"><span class="pill">📚 અભ્યાસ</span><span class="pill">💡 શંકા પોર્ટલ</span><span class="pill">🛡️ સુરક્ષા</span><span class="pill">☎️ મદદ</span></div></section><section class="loginbox"><div class="switch"><button class="${state.loginTab==='student'?'active':''}" onclick="state.loginTab='student';render()">🎒 વિદ્યાર્થી</button><button class="${state.loginTab==='teacher'?'active':''}" onclick="state.loginTab='teacher';render()">👩‍🏫 શિક્ષક</button></div><h2>${state.loginTab==='student'?'વિદ્યાર્થી લોગિન':'શિક્ષક લોગિન'}</h2><div class="sub">GitHub Pages demo — backend વગર ચાલતું version</div><form class="form" onsubmit="login(event)">${state.loginTab==='student'?`<div class="grid two"><div><label class="label">ધોરણ</label><select class="select" name="std"><option value="9">ધોરણ ૯</option><option value="10">ધોરણ ૧૦</option></select></div><div><label class="label">રોલ નંબર</label><input class="input" name="roll" type="number" min="1" max="80" placeholder="1–80" required></div></div>`:`<div><label class="label">મોબાઇલ નંબર</label><input class="input" name="phone" inputmode="numeric" maxlength="10" placeholder="10 અંકનો નંબર" required></div>`}<div><label class="label">પાસવર્ડ</label><input class="input" name="pass" type="password" placeholder="પાસવર્ડ" required></div><button class="btn primary" type="submit">${state.loginTab==='student'?'ડિજિટલ કેમ્પસમાં જાઓ':'શિક્ષક પોર્ટલમાં જાઓ'} →</button></form><div class="demohelp"><b>Demo login:</b><br>વિદ્યાર્થી: Roll 1–80 + <b>student9</b> અથવા <b>student10</b><br>શિક્ષક: કોઈપણ 10-digit નંબર + <b>teacher</b></div></section></div></div>`}
function top(){return `<header class="top"><div class="topin"><div class="brand"><img src="./logo.png"><div><b>${S.name}</b><small>Digital Campus System</small></div></div><div class="spacer"></div><span class="pill">${state.role==='student'?`🎒 ધોરણ ${state.user.std}`:'👩‍🏫 શિક્ષક પોર્ટલ'}</span><button class="btn ghost" onclick="logout()">⏻ Logout</button></div></header>`}
const studentNav=[['home','🏠','હોમ'],['doubt','💡','શંકા પોર્ટલ'],['complaint','📝','ફરિયાદ'],['bullying','🛡️','રેગિંગ'],['helpline','☎️','હેલ્પલાઇન'],['results','📊','પરિણામ'],['syllabus','📚','અભ્યાસક્રમ']];
const teacherNav=[['home','🏠','હોમ'],['tdoubts','💡','વિદ્યાર્થીની શંકા'],['tcomplaints','📝','ફરિયાદ'],['tsyllabus','📚','અભ્યાસક્રમ'],['marks','📊','ગુણ અપલોડ'],['students','👥','વિદ્યાર્થી યાદી'],['password','🔑','મારો પાસવર્ડ'],['backup','💾','ડેટા બેકઅપ']];
function nav(){const arr=state.role==='student'?studentNav:teacherNav;return `<aside class="side"><div class="sidebrand"><img src="./logo.png"><div><b>${S.name}</b><small style="display:block;color:var(--muted);margin-top:4px">${S.medium}</small></div></div><div class="identity"><strong>${esc(state.user.name)}</strong><small>${state.role==='student'?`ધોરણ ${state.user.std} · રોલ નં. ${state.user.roll}`:`${state.user.role} · ${state.user.phone}`}</small></div><nav class="nav">${arr.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</nav><div style="margin-top:20px" class="notice">💡 શંકા હોય તો પૂછો — Digital Campus માં તમારો પ્રશ્ન શિક્ષક સુધી પણ પહોંચી શકે છે.</div><button class="btn ghost" style="width:100%;margin-top:12px" onclick="logout()">⏻ લોગઆઉટ</button></aside>`}
function mobile(){return `<div class="mobilebar"><button class="menuBtn" onclick="openMenu()">☰</button><img src="./logo.png"><div><b>${S.name}</b><small style="display:block;color:var(--muted)">Digital Campus</small></div></div>`}
function openMenu(){const a=document.createElement('div');a.className='modal';a.id='menumodal';a.onclick=e=>{if(e.target===a)a.remove()};const arr=state.role==='student'?studentNav:teacherNav;a.innerHTML=`<div class="modalbox"><div class="modalhead"><b style="color:var(--green)">Menu</b><button class="close" onclick="document.getElementById('menumodal').remove()">×</button></div><div class="nav">${arr.map(x=>`<button onclick="go('${x[0]}');document.getElementById('menumodal').remove()">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</div></div>`;document.body.appendChild(a)}
function shell(content){return `${top()}${mobile()}<div class="layout">${nav()}<main class="main"><div class="page">${content}<div class="footer">${S.name} · Digital Campus System · ${S.year}</div></div></main></div>`}
function home(){if(state.role==='student')return studentHome();return teacherHome()}
function studentHome(){const ds=getList('doubts').filter(x=>x.roll===state.user.roll&&x.std===state.user.std),cs=getList('complaints').filter(x=>x.roll===state.user.roll&&x.std===state.user.std);return `<section class="hero"><div class="eyebrow">${S.name} · DIGITAL CAMPUS</div><h1>નમસ્તે ${esc(state.user.name)} 👋</h1><p>તમારા અભ્યાસ, શંકા અને campus support માટે એક જ જગ્યા. અહીંથી તમે તરત પ્રશ્ન પૂછી શકો છો, ફરિયાદ નોંધાવી શકો છો અને અભ્યાસક્રમ જોઈ શકો છો.</p><div class="chips"><span class="chip">ધોરણ ${state.user.std}</span><span class="chip gold">રોલ નં. ${state.user.roll}</span><span class="chip">🏠 ભવનવાસી</span></div></section><div class="grid stats"><div class="stat"><small>વિષયો</small><strong>${subjects.length}</strong></div><div class="stat"><small>ખુલ્લી શંકા</small><strong>${ds.filter(x=>x.status==='open').length}</strong></div><div class="stat"><small>નવી ફરિયાદ</small><strong>${cs.filter(x=>x.status==='નવી').length}</strong></div><div class="stat"><small>પરીક્ષાઓ</small><strong>${exams[state.user.std].length}</strong></div></div><section class="section"><div class="sectionhead"><div><h2>ઝડપી પ્રવેશ</h2><p>તમને જે જોઈએ ત્યાંથી શરૂ કરો.</p></div></div><div class="grid cards">${[['doubt','💡','શંકા પોર્ટલ','પ્રશ્ન પૂછો અને AI-style demo જવાબ મેળવો.'],['complaint','📝','ભવન / કેમ્પસ ફરિયાદ','સમસ્યા નોંધાવો અને browser માં status રાખો.'],['bullying','🛡️','રેગિંગ રિપોર્ટ','સુરક્ષિત રીતે ફરિયાદ નોંધાવવાનો demo flow.'],['helpline','☎️','હેલ્પલાઇન','મદદ માટે મહત્વના સંપર્ક options.'],['results','📊','પરિણામ','વિષયવાર ગુણ અને પરીક્ષા tabs.'],['syllabus','📚','અભ્યાસક્રમ','ધોરણ પ્રમાણે વિષય અને chapters.']].map(x=>`<article class="feature"><div class="ico">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p><button class="btn soft" onclick="go('${x[0]}')">ખોલો →</button></article>`).join('')}</div></section><section class="section grid two"><div class="panel"><div class="sectionhead"><div><h2>મારી શંકાઓ</h2><p>તાજેતરના પ્રશ્નો</p></div><button class="btn ghost" onclick="go('doubt')">બધું જુઓ</button></div>${ds.length?`<div class="list">${ds.slice(0,4).map(x=>`<div class="row"><div><b>${esc(x.question)}</b><small>${new Date(x.date).toLocaleDateString('gu-IN')}</small></div><span class="badge ${x.status==='open'?'rose':''}">${x.status==='open'?'શિક્ષક પાસે':'જવાબ મળ્યો'}</span></div>`).join('')}</div>`:`<div class="empty"><div class="big">💡</div>હજુ કોઈ શંકા નથી.</div>`}</div><div class="panel"><div class="sectionhead"><div><h2>મારી ફરિયાદ</h2><p>તાજેતરના reports</p></div><button class="btn ghost" onclick="go('complaint')">ફરિયાદ કરો</button></div>${cs.length?`<div class="list">${cs.slice(0,4).map(x=>`<div class="row"><div><b>${esc(x.subject||x.details.slice(0,45))}</b><small>${x.category==='bullying'?'🛡️ રેગિંગ':x.category==='hostel'?'🏠 ભવન':'🏫 કેમ્પસ'}</small></div><span class="badge gold">${x.status}</span></div>`).join('')}</div>`:`<div class="empty"><div class="big">📝</div>હજુ કોઈ ફરિયાદ નથી.</div>`}</div></section>`}
function getList(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}}function putList(k,v){localStorage.setItem(k,JSON.stringify(v))}
function doubt(){const ds=getList('doubts').filter(x=>x.roll===state.user.roll&&x.std===state.user.std);return `<div class="sectionhead"><div><h1 class="h-title" style="font-size:30px;color:var(--green);margin:0">💡 શંકા પોર્ટલ</h1><p>ગણિત, વિજ્ઞાન, ભાષા કે કોઈપણ વિષયનો પ્રશ્ન પૂછો.</p></div></div><div class="grid two"><div class="panel"><h2 style="margin-top:0;color:var(--green)">તમારો પ્રશ્ન</h2><form class="form" onsubmit="askDoubt(event)"><div><label class="label">વિષય</label><select class="select" name="sub">${subjects.map(s=>`<option value="${s[0]}">${s[3]} ${s[1]}</option>`).join('')}</select></div><div><label class="label">પ્રશ્ન</label><textarea class="textarea" name="q" placeholder="તમારો પ્રશ્ન સરળ ભાષામાં લખો…" required></textarea></div><button class="btn primary">AI-style જવાબ મેળવો →</button></form><div class="notice" style="margin-top:14px">આ GitHub Pages version static demo છે. Real AI API અને teacher database માટે backend જોડવો પડશે.</div></div><div class="panel"><h2 style="margin-top:0;color:var(--green)">મારા પ્રશ્નો</h2>${ds.length?`<div class="list">${ds.map(d=>`<div class="row"><div><b>${esc(d.question)}</b><small>${d.subject} · ${new Date(d.date).toLocaleString('gu-IN')}</small></div><span class="badge ${d.status==='open'?'rose':''}">${d.status==='open'?'OPEN':'ANSWERED'}</span></div><div class="notice">🤖 ${esc(d.answer)}</div>`).join('')}</div>`:`<div class="empty"><div class="big">🌱</div>પ્રથમ પ્રશ્ન તમે પૂછો!</div>`}</div></div>`}
function askDoubt(e){e.preventDefault();const f=new FormData(e.target);const a={id:Date.now(),roll:state.user.roll,std:state.user.std,subject:f.get('sub'),question:f.get('q'),status:'open',date:new Date().toISOString(),answer:'તમારો પ્રશ્ન મળ્યો. આ demo mode માં AI-style જવાબનું પ્રદર્શન થાય છે અને પ્રશ્ન teacher portal માટે નોંધાય છે. Real AI જોડ્યા પછી અહીં સાચો વિષયવાર જવાબ આવશે.'};const l=getList('doubts');l.unshift(a);putList('doubts',l);e.target.reset();render();toast('પ્રશ્ન શિક્ષક સુધી મોકલાયો છે 💡')}
function complaint(){const cs=getList('complaints').filter(x=>x.roll===state.user.roll&&x.std===state.user.std);return `<div class="sectionhead"><div><h1 style="font-size:30px;margin:0;color:var(--green)">📝 ફરિયાદ / Support</h1><p>ભવન, campus અથવા રેગિંગ સંબંધિત સમસ્યા નોંધાવો.</p></div></div><div class="grid two"><div class="panel"><form class="form" onsubmit="submitComplaint(event)"><div class="tabs"><button type="button" class="active">🏫 Support</button></div><div><label class="label">પ્રકાર</label><select class="select" name="cat"><option value="hostel">🏠 ભવન / હોસ્ટેલ</option><option value="campus">🏫 કેમ્પસ</option><option value="bullying">🛡️ રેગિંગ / Bullying</option></select></div><div><label class="label">વિષય</label><input class="input" name="subject" placeholder="સમસ્યાનો ટૂંકો વિષય"></div><div><label class="label">વિગત</label><textarea class="textarea" name="details" placeholder="શું થયું? ક્યારે થયું? ક્યાં થયું?" required></textarea></div><div><label class="label">ગંભીરતા</label><select class="select" name="severity"><option>સામાન્ય</option><option>જરૂરી</option><option>તાત્કાલિક</option></select></div><button class="btn primary">ફરિયાદ નોંધાવો →</button></form></div><div class="panel"><h2 style="margin-top:0;color:var(--green)">મારા reports</h2>${cs.length?`<div class="list">${cs.map(c=>`<div class="row"><div><b>${esc(c.subject||'ફરિયાદ')}</b><small>${esc(c.details)}</small></div><span class="badge ${c.status==='નવી'?'rose':''}">${c.status}</span></div>`).join('')}</div>`:`<div class="empty"><div class="big">🛡️</div>હજુ કોઈ report નથી.</div>`}</div></div>`}
function submitComplaint(e){e.preventDefault();const f=new FormData(e.target);const c={id:Date.now(),roll:state.user.roll,std:state.user.std,category:f.get('cat'),subject:f.get('subject'),details:f.get('details'),severity:f.get('severity'),status:'નવી',date:new Date().toISOString()};const l=getList('complaints');l.unshift(c);putList('complaints',l);e.target.reset();render();toast('ફરિયાદ નોંધાઈ ગઈ ✅')}
function bullying(){return `<div class="panel" style="max-width:850px;margin:auto"><div class="eyebrow" style="color:var(--green2)">PRIVATE SUPPORT</div><h1 style="color:var(--green);margin:6px 0">🛡️ રેગિંગ / Bullying Report</h1><p style="color:var(--muted);line-height:1.7">તમારી સુરક્ષા મહત્વની છે. આ demo flow માં તમારું નામ report card પર દેખાડવામાં આવતું નથી.</p><div class="notice">🔒 <b>Anonymous-style demo:</b> report browser માં save થાય છે. Real deployment માં secure database + teacher access rules જરૂરી રહેશે.</div><form class="form" style="margin-top:16px" onsubmit="submitComplaint(event)"><input type="hidden" name="cat" value="bullying"><div><label class="label">શું થયું?</label><textarea class="textarea" name="details" minlength="20" placeholder="ક્યારે, ક્યાં અને શું થયું તેની વિગત લખો…" required></textarea></div><div><label class="label">ગંભીરતા</label><select class="select" name="severity"><option>જરૂરી</option><option>તાત્કાલિક</option><option>સામાન્ય</option></select></div><input type="hidden" name="subject" value="Anonymous Bullying Report"><button class="btn danger">🛡️ Report securely</button></form></div>`}
function helpline(){return `<div class="sectionhead"><div><h1 style="font-size:30px;margin:0;color:var(--green)">☎️ હેલ્પલાઇન</h1><p>જરૂર પડે ત્યારે તરત યોગ્ય વ્યક્તિ સુધી પહોંચો.</p></div></div><div class="grid cards">${[['🏫','શાળા કાર્યાલય','સામાન્ય શૈક્ષણિક / campus મદદ'],['🏠','ભવન / હોસ્ટેલ','રૂમ, ભવન અથવા basic facility issue'],['👩‍🏫','નજીકના શિક્ષક','તાત્કાલિક guidance અથવા safety support'],['🛡️','સુરક્ષા support','રેગિંગ / bullying માટે તરત જાણ કરો'],['🚑','તાત્કાલિક પરિસ્થિતિ','સ્થાનિક emergency service અથવા responsible adult ને તરત સંપર્ક કરો'],['💡','શંકા પોર્ટલ','અભ્યાસ સંબંધિત પ્રશ્ન માટે digital support']].map(x=>`<article class="feature"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn soft" onclick="toast('Demo contact — real number backend/admin settings માં ઉમેરશો.')">સંપર્ક</button></article>`).join('')}</div>`}
function results(){return `<div class="sectionhead"><div><h1 style="font-size:30px;margin:0;color:var(--green)">📊 પરિણામ પત્ર</h1><p>${esc(state.user.name)} · ધોરણ ${state.user.std} · રોલ ${state.user.roll}</p></div></div><div class="notice">Demo version માં result structure અને exam tabs બતાવવામાં આવ્યા છે. Real student marks teacher dashboard/backendમાંથી આવશે.</div><div class="tabs" style="margin-top:15px">${exams[state.user.std].map((e,i)=>`<button class="${i===0?'active':''}" onclick="showExam(this,'${e[0]}')">${e[1]} /${e[2]}</button>`).join('')}</div><div id="exampanel">${examPanel(exams[state.user.std][0])}</div>`}
function showExam(btn,code){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const e=exams[state.user.std].find(x=>x[0]===code);document.getElementById('exampanel').innerHTML=examPanel(e)}
function examPanel(e){return `<div class="panel"><div class="sectionhead"><div><h2>${e[1]}</h2><p>પૂરા ગુણ ${e[2]}${e[3]?` · પાસ ગુણ ${e[3]}`:' · આંતરિક વિભાગ'}</p></div><span class="badge gold">DEMO DATA</span></div><div class="tablewrap"><table class="table"><thead><tr><th>વિષય</th><th>ગુણ</th><th>Rank</th><th>Status</th></tr></thead><tbody>${subjects.map(s=>`<tr><td>${s[3]} ${s[1]}</td><td>— / ${e[2]}</td><td>—</td><td><span class="badge">Pending</span></td></tr>`).join('')}</tbody></table></div></div>`}
function syllabusView(){const ss=subjects;return `<div class="sectionhead"><div><h1 style="font-size:30px;margin:0;color:var(--green)">📚 અભ્યાસક્રમ</h1><p>ધોરણ ${state.user.std} · વિષય પ્રમાણે chapters.</p></div></div><div class="grid cards">${ss.map((s,i)=>`<article class="feature"><div class="ico">${s[3]}</div><h3>${s[1]}</h3><p>${s[2]} · ${i<2?'Core subject':'Language / support subject'}</p><button class="btn soft" onclick="openSyllabus('${s[0]}')">Chapters →</button></article>`).join('')}</div><div id="syllabusdetail" class="section"></div>`}
function openSyllabus(code){const s=subjects.find(x=>x[0]===code),ch=syllabus[state.user.std]||[];document.getElementById('syllabusdetail').innerHTML=`<div class="panel"><div class="sectionhead"><div><h2>${s[3]} ${s[1]}</h2><p>${s[2]} · ધોરણ ${state.user.std}</p></div><button class="btn ghost" onclick="document.getElementById('syllabusdetail').innerHTML=''">Close</button></div><div class="list">${ch.map((x,i)=>`<div class="row"><div><b>${i+1}. ${x}</b><small>${['જૂન','જુલાઈ','ઑગસ્ટ','સપ્ટેમ્બર'][i]||'નવેમ્બર'}</small></div><span class="badge">Chapter</span></div>`).join('')}</div></div>`}
function teacherHome(){const ds=getList('doubts'),cs=getList('complaints');return `<section class="hero"><div class="eyebrow">TEACHER PORTAL · DIGITAL CAMPUS</div><h1>નમસ્તે ${esc(state.user.name)} 👋</h1><p>વિદ્યાર્થીની શંકા, campus complaints અને academic data માટેનું teacher workspace.</p><div class="chips"><span class="chip">👩‍🏫 ${state.user.role}</span><span class="chip gold">વિષય · ગણિત</span><span class="chip">DEMO MODE</span></div></section><div class="grid stats"><div class="stat"><small>Open doubts</small><strong>${ds.filter(x=>x.status==='open').length}</strong></div><div class="stat"><small>New complaints</small><strong>${cs.filter(x=>x.status==='નવી').length}</strong></div><div class="stat"><small>Students</small><strong>80</strong></div><div class="stat"><small>Classes</small><strong>2</strong></div></div><section class="section"><div class="sectionhead"><div><h2>Teacher workspace</h2><p>તમારા મુખ્ય tools.</p></div></div><div class="grid cards">${[['tdoubts','💡','Student doubts','વિદ્યાર્થીઓના પ્રશ્નો જુઓ.'],['tcomplaints','📝','Complaints','Hostel, campus અને bullying reports.'],['tsyllabus','📚','Syllabus','વિષય અને chapter structure.'],['marks','📊','Marks entry','Exam-wise marks interface.'],['students','👥','Student list','Student data માટેનું workspace.'],['backup','💾','Data backup','Static demo data browser માં છે.']].map(x=>`<article class="feature"><div class="ico">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p><button class="btn soft" onclick="go('${x[0]}')">Open →</button></article>`).join('')}</div></section>`}
function tdoubts(){const ds=getList('doubts');return `<div class="sectionhead"><div><h1 style="font-size:30px;margin:0;color:var(--green)">💡 વિદ્યાર્થીની શંકા</h1><p>Student questions received from demo portal.</p></div></div><div class="panel">${ds.length?`<div class="list">${ds.map(d=>`<div class="row"><div><b>${esc(d.question)}</b><small>ધોરણ ${d.std} · રોલ ${d.roll} · ${d.subject}</small></div><button class="btn soft" onclick="answerDoubt(${d.id})">જવાબ</button></div>`).join('')}</div>`:`<div class="empty"><div class="big">💡</div>હજુ કોઈ student doubt નથી.</div>`}</div>`}
function answerDoubt(id){const l=getList('doubts'),i=l.findIndex(x=>x.id===id);if(i<0)return;l[i].status='answered';l[i].answer='શિક્ષકનો demo જવાબ: પ્રશ્ન ધ્યાનથી વાંચ્યો. વર્ગમાં આ concept ફરી સમજાવવામાં આવશે.';putList('doubts',l);render();toast('જવાબ મોકલાયો ✅')}
function tcomplaints(){const cs=getList('complaints');return `<div class="sectionhead"><div><h1 style="font-size:30px;margin:0;color:var(--green)">📝 Complaints</h1><p>Hostel, campus અને anonymous-style bullying reports.</p></div></div><div class="panel">${cs.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Type</th><th>Subject</th><th>Details</th><th>Status</th><th>Action</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${c.category}</td><td>${esc(c.subject)}</td><td>${esc(c.details)}</td><td><span class="badge">${c.status}</span></td><td><button class="btn soft" onclick="resolveComplaint(${c.id})">Resolve</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">📝</div>હજુ કોઈ complaint નથી.</div>`}</div>`}
function resolveComplaint(id){const l=getList('complaints'),i=l.findIndex(x=>x.id===id);if(i<0)return;l[i].status='ઉકેલાઈ';putList('complaints',l);render();toast('Complaint resolved ✅')}
function tsyllabus(){return `<div class="sectionhead"><div><h1 style="font-size:30px;margin:0;color:var(--green)">📚 Teacher Syllabus</h1><p>ધોરણ ૯ અને ૧૦ માટે demo curriculum workspace.</p></div></div><div class="grid two">${[9,10].map(std=>`<div class="panel"><h2 style="margin-top:0;color:var(--green)">ધોરણ ${std}</h2><div class="list">${subjects.map(s=>`<div class="row"><div><b>${s[3]} ${s[1]}</b><small>${s[2]}</small></div><span class="badge">${syllabus[std].length} demo chapters</span></div>`).join('')}</div></div>`).join('')}</div>`}
function marks(){return `<div class="sectionhead"><div><h1 style="font-size:30px;margin:0;color:var(--green)">📊 ગુણ અપલોડ</h1><p>Teacher marks-entry interface preview.</p></div></div><div class="panel"><div class="grid two"><div><label class="label">ધોરણ</label><select class="select"><option>9</option><option>10</option></select></div><div><label class="label">પરીક્ષા</label><select class="select">${exams[9].map(e=>`<option>${e[1]}</option>`).join('')}</select></div></div><div class="notice" style="margin-top:15px">આ GitHub Pages demo માં real marks database નથી. Real version માટે teacher dashboard ને backend/Supabase/SQLite સાથે connect કરવું પડશે.</div></div>`}
function students(){return `<div class="sectionhead"><div><h1 style="font-size:30px;margin:0;color:var(--green)">👥 વિદ્યાર્થી યાદી</h1><p>Real deployment માં અહીં teacher student data manage કરી શકશે.</p></div></div><div class="panel"><div class="statgrid"><div class="kpi"><b>80</b><small>ધોરણ 9 demo slots</small></div><div class="kpi"><b>80</b><small>ધોરણ 10 demo slots</small></div><div class="kpi"><b>160</b><small>Total demo capacity</small></div></div><div class="notice" style="margin-top:15px">Student names/parents/phone જેવી sensitive data આ public static demo માં intentionally નથી રાખવામાં આવી.</div></div>`}
function password(){return `<div class="panel" style="max-width:650px"><h1 style="color:var(--green);margin-top:0">🔑 મારો પાસવર્ડ</h1><p style="color:var(--muted)">GitHub Pages static version માં real authentication backend નથી.</p><div class="notice">Real version માં password change માટે secure server/database જરૂરી છે.</div></div>`}
function backup(){return `<div class="panel" style="max-width:750px"><h1 style="color:var(--green);margin-top:0">💾 Data backup</h1><p style="color:var(--muted)">આ version browser localStorage નો ઉપયોગ કરે છે.</p><button class="btn gold" onclick="downloadDemo()">⬇️ Demo data export</button></div>`}
function downloadDemo(){const data={doubts:getList('doubts'),complaints:getList('complaints')};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='digital-campus-demo-data.json';a.click();URL.revokeObjectURL(a.href);toast('Demo data export થઈ ગયો.')}
function page(){switch(state.page){case'home':return home();case'doubt':return doubt();case'complaint':return complaint();case'bullying':return bullying();case'helpline':return helpline();case'results':return results();case'syllabus':return syllabusView();case'tdoubts':return tdoubts();case'tcomplaints':return tcomplaints();case'tsyllabus':return tsyllabus();case'marks':return marks();case'students':return students();case'password':return password();case'backup':return backup();default:return home()}}
function render(){if(!state.user){document.getElementById('root').innerHTML=loginView();return}document.getElementById('root').innerHTML=shell(page())}
window.addEventListener('hashchange',()=>{state.page=location.hash.slice(1)||'home';render()});state.page=location.hash.slice(1)||'home';render();
</script>
</body>
</html>
